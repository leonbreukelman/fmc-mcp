[project]
name = "mcp-server-fmc"
version = "0.1.0"
description = "Read-only MCP server for Cisco Firepower Management Center (FMC)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["mcp", "cisco", "fmc", "firepower", "firewall", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking :: Firewalls",
]

dependencies = [
    "mcp>=1.28.1,<3",
    "httpx>=0.28.1,<1",
    "pydantic>=2.12.5,<3",
    "pydantic-settings>=2.12.0,<3",
    "python-dotenv>=1.2.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2,<10",
    "pytest-asyncio>=1.3.0,<2",
    "pytest-httpx>=0.36.0,<1",
    "pytest-cov>=7.0.0,<8",
    "ruff>=0.15.4,<1",
    "mypy>=1.19.1,<3",
    "pyright>=1.1.411,<2",
    "pre-commit>=4.5.1,<5",
    "pip-audit>=2.10.1,<3",
]

[project.scripts]
mcp-server-fmc = "fmc_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fmc_mcp"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: opt-in read-only tests against a real FMC instance"]

[tool.coverage.run]
branch = true
source = ["fmc_mcp"]

[tool.coverage.report]
fail_under = 80
show_missing = true
